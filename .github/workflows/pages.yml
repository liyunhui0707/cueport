name: Product website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build_website.py'
      - 'scripts/test_website.py'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check website facts and links
        run: python3 scripts/test_website.py
      - name: Build selected published-release site
        run: python3 scripts/build_website.py --output build/website
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/website
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
